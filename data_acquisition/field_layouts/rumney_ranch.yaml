open_questions:
  - "Canals.gdb holds an earlier, partial pass of the canal mapping (48-90% of each layer within 1 m of the matching Rumney_Canals2018.gdb layer, which is longer). Kept as variant pass-1. For 2018-06-21 (colony a) and 2018-07-17 (colony f) it is the only canal mapping. Keep both passes, or only the per-colony one where it exists?"
  - "D06Sept2019_Dams_Rumney is named 06Sept2019, but no Rumney photos were taken that day (2019 photos: 09-03, eastern part; 09-05, the rest). Kept as 2019-09-06 for now: was it drawn on the 09-05 orthomosaic (then 2019-09-05)?"
  - "2019 orthomosaics are in folder '14. 02Sept2019' but no photos were taken on 09-02. Tiles 1-2 fall inside the area photographed on 09-03 and tiles 3-6 inside the area of 09-05, so they are placed on those days."
  - "RUMNEY_SIX_21June2018.tif has a local CRS without a name (LOCAL_CS, metres): its position cannot be read. Kept; the catalog will flag it. Is there a correctly georeferenced copy?"
  - "Colony boundaries, lodges, dam widths and thicknesses and the river reach have no day in their names: placed under 2018. Do you know which survey they were drawn on?"
