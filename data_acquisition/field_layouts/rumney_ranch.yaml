# Layout of Rumney Ranch in beaver_dataset/: where each original file goes, under the names of
# docs/dataset/field_naming.md, or why it is left out. DRAFT by Claude: review, then set `reviewed`.
schema: 1
site: rumney_ranch
authored: {by: claude, model: claude-opus-5-5, date: 2026-10-15, note: "from output/dataset/manifest.csv and checks in session (byte comparisons, footprints, 1 m overlap of layers)"}
reviewed:
  by: Federico Oliva
  date: 2026-10-15
base: "2018 Field Season/Drone Flights/Rumney Ranch/"        # sources are relative to this folder of the drive unless they start with a season folder

photos: by_exif_date  # surveys/<capture date>/photos/<camera folder>/<photo>, as in manifest.csv; duplicates and strays left out by rule

# Added by Claude on 2026-10-15, after the review, as agreed in session:
crs_corrections:
  - from: WGS_1984_ARC_System_Zone_12
    to: "+proj=eqc +lat_ts=-52.28859923 +lat_0=0 +lon_0=0 +x_0=0 +y_0=0 +R=6378137 +units=m +no_defs"
    reason: "ArcGIS evaluates the ARC System zones on a sphere of radius 6378137 m. Declared as written, newer
      PROJ (GDAL 3.12, QGIS) evaluates it on the WGS 84 ellipsoid and places every layer about 25 km north-east.
      Checked against coordinates ArcGIS itself wrote: Riverreach2018_points LAT/LONG within 0.19 m (median) with
      the sphere; riverpointsdistributed2.shp LAT within 3 m (its LAT has 4 decimals) with the sphere, 25 km off
      as declared."

