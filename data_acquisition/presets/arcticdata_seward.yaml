# Seward Peninsula beaver drone surveys, NSF Arctic Data Center (Tape, Jones et al.).
# See docs/dataset/beaver_open_datasets.md, sections A1 and A2.
#
# Manual fields take {value, by, date[, note]}; leave them null until someone has checked.
# `curate` lists every null field as missing.

dataset: arcticdata_seward
adapter: arcticdata
title: Seward Peninsula beaver drone surveys (Arctic Data Center)

# what the adapter downloads (doi: optional file-name regex)
downloads:
  doi:10.18739/A2J09W600: null          # Swan Lake MP64, 3 Aug 2021, P4RTK orthomosaic + DSM
  doi:10.18739/A2D795C54: null          # Swan Lake MP64, 3 Aug 2021, P4 Multispectral
  doi:10.18739/A25M6284J: null          # Swan Lake MP64, 27 Mar 2022, P4RTK orthomosaic + DSM
  doi:10.18739/A2NS0M03W: null          # Swan Lake MP64, 12 Aug 2022, P4RTK orthomosaic + DSM
  doi:10.18739/A2RJ48W7C: null          # Swan Lake MP64, 12 Aug 2022, P4 Multispectral
  doi:10.18739/A2H12V896: null          # Swan Lake MP64, 2 Aug 2023, P4 Multispectral
  doi:10.18739/A22R3NZ98: ^Swan_Lake_DLB_   # ABON 2024 (9 sites), Swan Lake files only

sites:
  swan_lake_dlb:
    name: Swan Lake drained lake basin (MP64), Seward Peninsula, Alaska
    match: ^Swan_Lake_DLB_            # file-name regex
    crs: EPSG:32603                   # UTM zone 3N, metres
    confirmed: null                   # {by, date} once someone has checked the site assignment
    colonies: null                    # from AOI estimation and review (pipeline_design.md §5.3)
    land_status: null                 # not stated in the metadata; possibly Alaska Native corporation land
    governance: null                  # licence is CC0, which does not settle Indigenous data governance
