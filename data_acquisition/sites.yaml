# Site registry: every site the dataset summaries use, defined once.
# name and crs (the site's local UTM zone, or national grid) are facts; colonies, land_status and governance
# are entered by a person as {value, by, date[, note]} and stay null until someone has checked them.
# level is site (default) or region (an area holding several sites); contains lists the registry sites
# mostly inside a region's footprint. Hints for those fields come from each dataset's summary. Schema: data_acquisition/catalog/summary.py.

schema: 1
sites:
  glacier_creek:
    name: Glacier Creek, Seward Peninsula, Alaska
    crs: EPSG:32603
    colonies: null
    land_status: null
    governance: null
