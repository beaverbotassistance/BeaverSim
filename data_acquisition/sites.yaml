  kotzebue_study_area:
    name: Kotzebue study area (100 km²), northwestern Baldwin Peninsula, Alaska
    crs: EPSG:32603
    colonies: null
    land_status: null
    governance: null
    level: region
    contains: [kotz_3]                  # kotz_b_west only 23% inside the dam extent
  seward_baldwin_watersheds:
    name: 89 beaver-occupied watersheds, Seward Peninsula and Baldwin Peninsula, Alaska
    crs: EPSG:3338                      # Alaska Albers: the watersheds span UTM zones 3 and 4
    colonies: null
    land_status: null
    governance: null
    level: region
    contains: [glacier_creek, grouse_creek, kotz_3, kotz_b_east, kotz_b_south, kotz_b_west,
               south_fork_serpentine_river, swan_lake_creek, swan_lake_dlb_mp64, upper_nome_river]
