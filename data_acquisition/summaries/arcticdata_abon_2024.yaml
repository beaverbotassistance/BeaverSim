groups:
- folder: arcticdata/doi_10.18739_A22R3NZ98
  doi: doi:10.18739/A22R3NZ98
  download_filter: ^(?!Swan_Lake_DLB_)    # Swan Lake DLB files belong to arcticdata_seward
  record:
    path: metadata.xml
    format: eml
  platform: DJI Mavic 3 Multispectral
  positioning:
  - rtk
  notes:
  - Same ABON package as the Swan Lake DLB group of arcticdata_seward; this group covers the other sites' 27 files.
  - The EML entity descriptions are shuffled for Kotz_B_South, Kotz_B_West, South_Fork_Serpentine_River,
    Swan_Lake_Creek and Upper_Nome_River (each file described as one of its siblings), and correct for Glacier_Creek,
    Grouse_Creek, Kotz_3 and Kotz_B_East. Products are taken from the file names, resolutions and band counts, which
    agree with each other for every file.
  evidence:
  - 'doi: folder name doi_10.18739_A22R3NZ98; beaver_open_datasets.md A1'
  - 'site: file name prefix before _M3_ (Glacier_Creek, Grouse_Creek, Kotz_3, Kotz_B_East, Kotz_B_South, Kotz_B_West,
    South_Fork_Serpentine_River, Swan_Lake_Creek, Upper_Nome_River); site names and peninsulas from
    beaver_open_datasets.md A1/A2. GeoTIFF lonlat bboxes put the Kotz sites at about 66.8 N, -162.4 E (Baldwin
    Peninsula) and the others at 64.6-65.9 N, -165.5..-164.7 E (Seward Peninsula)'
  - 'date: file names (DDMonthYYYY), per file; EML dates 2024-08-02..2024-08-07'
  - 'platform: methods text (DJI Mavic 3 Multispectral quadcopter); file names say M3'
  - 'positioning: rtk from the methods text (DJI D-RTK 2 Mobile Base Station). The methods also mention Leica Viva ground control, but this record has no processing reports; the same team''s workflow is documented by 35 Pix4D reports (arcticdata_seward 6, arcticdata_seward_repeat 29), all stating ''Georeferencing: yes, no 3D GCP'', so gcp is not set, for consistency with them'
  - 'products: file names (Orthomosaic_RGB 5cm, Digital_Surface_Model 10cm, Multispectral_Bands 10cm), GeoTIFF
    resolutions (0.05, 0.1, 0.1 m) and band counts (3 uint8, 1 float32, 4 float32), matching the three products in
    the methods text'
  - 'bands (multispectral): methods text (green, red, red edge, near-infrared) and the correctly placed EML entities
    (band 1 = green ... band 4 = near infrared); the GeoTIFF header does not declare them (gray + undefined)'
  - 'unit (multispectral): methods text (MicaSense calibrated reflectance panel, normalize reflectance values)'
  - 'vertical_datum (dsm): file names (Ellipsoid_Height) and EML DSM definitions (Ellipsoid height in meters (m))'
  - 'orthomosaic bands: GeoTIFF header declares red, green, blue; EML says band 1 = blue, band 2 = green, band 3 = red'
