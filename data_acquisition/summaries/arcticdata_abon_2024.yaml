open_questions:
- 'Site count: the methods text and beaver_open_datasets.md say nine ABON sites, but the files name ten (these nine plus
  Swan_Lake_DLB, in arcticdata_seward). Which one is not counted as an ABON site?'
- 'Kotz_B_East is dated 08August2024 in its file names, one day after the EML temporal coverage ends (2024-08-07).
  Which is right?'
- 'RGB band order: every orthomosaic header declares red, green, blue, while the EML says blue, green, red. The header
  order is used; check one file visually.'
- 'Site identity across summaries: beaver_open_datasets.md A2 lists earlier surveys at Upper Nome River (MP31), Glacier
  Creek Road, Swan Lake Creek, South Fork Serpentine River and Kotzebue B East/West/South/3. Should these slugs match
  the sites of those records when they are added, and is Glacier_Creek the same site as Glacier Creek Road and
  Upper_Nome_River the same as MP31? Footprints should be compared when the earlier records are downloaded.'
- 'Positioning is set to rtk in arcticdata_seward, arcticdata_abon_2024 and arcticdata_seward_repeat: the 35 Pix4D reports of this team state no 3D GCP in processing. Still open: what the Leica Viva survey the methods mention was used for (the RTK base station''s coordinates, or check points); the reports or the authors may say.'
- 'unit: reflectance is inferred from the radiometric calibration in the methods; the value scale (0-1 or percent) is
  not stated. Check on a sample (multispectral nodata is -10000).'
- 'Vertical datum: ellipsoid heights with a WGS84 horizontal datum; the ellipsoid realisation (WGS84 vs ITRF/NAD83 via
  the Leica survey) is not stated.'
- 'DSM over water: the earlier Seward records warn that elevation over waterbodies is noisy; beaver_open_datasets.md A1
  says the same for ABON, but the ABON methods text in the evidence does not. Confirm before adding the note.'
- Land status and Indigenous data governance are not stated for any site (see site hints).
