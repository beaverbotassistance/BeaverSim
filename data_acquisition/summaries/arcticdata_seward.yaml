# Drafted by Claude in a Claude Code session (describe prompt), reviewed by Federico Oliva.
schema: 1
dataset: arcticdata_seward
title: Repeat drone surveys of the Swan Lake drained lake basin (MP64) beaver dams, Seward Peninsula, Alaska, 2021-2024
  (orthomosaics, DSMs, multispectral; Jones and Tape, NSF Arctic Data Center)
authored:
  by: claude
  model: claude-opus-5-5
  date: 2026-10-13
  note: Claude Code session, from evidence.json
reviewed:
  by: Federico Oliva
  date: 2026-10-13
source:
  kind: dataone
  provider: NSF Arctic Data Center
  url: https://arcticdata.io
  log: downloads.csv
# Sites are defined once in data_acquisition/sites.yaml (name, CRS, land status, governance, colonies);
# here only this dataset's hints for them.
sites:
  swan_lake_dlb_mp64:
    hints:
      land_status: Not stated in any EML record. beaver_open_datasets.md (A1 'Watch out' and Notes) says the Alaska
        sites may be on Alaska Native corporation lands; to check against land records.
      governance: All five EML records give CC0-1.0, which settles copyright only (beaver_open_datasets.md, Notes).
        The ABON 2024 methods text says local land managers and community representatives were informed 'where appropriate';
        no data-use or Indigenous data governance terms are stated.
groups:
- folder: arcticdata/doi_10.18739_A2D795C54
  doi: doi:10.18739/A2D795C54
  record:
    path: metadata.xml
    format: eml
  site: swan_lake_dlb_mp64
  date: 2021-08-03
  platform: DJI Phantom 4 RTK Multispectral
  positioning:
  - rtk
  - gcp
  evidence:
  - 'doi: folder name doi_10.18739_A2D795C54'
  - 'site: file names (Swan_Lake_DLB_MP64) and EML title (Swan Lake Drained Lake Basin (MP64), Seward Peninsula)'
  - 'date: file names (03August2021 / 03Aug2021), EML dates and methods text (03 August 2021)'
  - 'platform: methods text (DJI Phantom 4 Real-Time Kinematic (DJI P4RTK) Multispectral quadcopter); file names
    say P4_Multispectral'
  - 'positioning: methods text (DJI D-RTK 2 Mobile Base Station -> rtk; Leica Viva differential GPS provided ground
    control -> gcp)'
  - 'product multispectral: file name (P4_MultiSpectral), EML title (Multispectral Orthomosaic Image), 5-band float32
    GeoTIFF'
  - 'bands: EML entity attributes (Blue, Green, Red, Red Edge, Near Infrared); the GeoTIFF header does not declare
    them (gray + undefined)'
  - 'unit: methods text (MicaSense calibrated reflectance panel, radiometric calibration in Pix4D Index Calculator)'
  - 'report: file name (P4_Multispectral_Pix4D_Report), same date and sensor as the multispectral file'
  files:
  - path: Swan_Lake_DLB_MP64_P4_MultiSpectral_03Aug2021_WGS84_UTM_Zone_3N_10cm.tif
    product: multispectral
    bands: [blue, green, red, rededge, nir]
    unit: reflectance
  - path: Swan_Lake_DLB_MP64_03August2021_P4_Multispectral_Pix4D_Report.pdf
    role: report
    attach_to: [multispectral]
