- folder: arcticdata/doi_10.18739_A22R3NZ98
  doi: doi:10.18739/A22R3NZ98
  download_filter: ^Swan_Lake_DLB_       # ABON holds nine sites (24.5 GB); download only Swan Lake
  record:
    path: metadata.xml
    format: eml
  site: swan_lake_dlb_mp64
  date: 2024-08-04
  platform: DJI Mavic 3 Multispectral
  positioning:
  - rtk
  - gcp
  notes:
  - Part of the ABON August 2024 multi-site package (nine sites); only the three Swan Lake DLB files are in this folder.
  - ABON file names say Swan_Lake_DLB without MP64; assigned to the MP64 site because the name matches and the GeoTIFF
    footprints overlap the 2021-2023 MP64 rasters.
  - The EML entity descriptions for the three Swan Lake DLB files are shuffled (DSM described as 4 multispectral bands,
    multispectral as 3 RGB bands, orthomosaic as elevation); the same shuffle affects other ABON sites in the record.
    Products are taken from the file names, resolutions and band counts instead.
  evidence:
  - 'doi: folder name doi_10.18739_A22R3NZ98; also beaver_open_datasets.md A1'
  - 'site: file names (Swan_Lake_DLB) and GeoTIFF lonlat bboxes (about -164.82..-164.80 E, 65.165..65.172 N), which
    overlap the MP64 groups; beaver_open_datasets.md A2 lists Swan Lake MP64 Aug 2024 as a possible ABON site'
  - 'date: file names (04August2024), within EML dates 2024-08-02..2024-08-07'
  - 'platform: methods text (DJI Mavic 3 Multispectral quadcopter)'
  - 'positioning: methods text (DJI D-RTK 2 Mobile Base Station -> rtk; Leica Viva differential GPS ground control
    -> gcp)'
  - 'products: file names (Orthomosaic_RGB 5cm, Digital_Surface_Model 10cm, Multispectral_Bands 10cm), matching the
    three products and resolutions in the methods text and the GeoTIFF band counts (3, 1, 4)'
  - 'bands (multispectral): methods text (green, red, red edge, near-infrared) and EML entities of the other ABON
    sites (band 1 = green ... band 4 = near infrared); not declared in the GeoTIFF header'
  - 'unit: methods text (MicaSense calibrated reflectance panel, normalize reflectance values)'
  - 'vertical_datum: file name (Ellipsoid_Height) and ABON EML DSM definitions (Ellipsoid height in meters (m))'
  files:
  - path: Swan_Lake_DLB_M3_Orthomosaic_RGB_04August2024_WGS84_UTM_Zone_3N_5cm.tif
    product: orthomosaic
    notes:
    - The GeoTIFF header declares bands red, green, blue; ABON EML orthomosaic entities give band 1 = blue, band 2 = green,
      band 3 = red. The header order is used.
    - The EML entity for this file wrongly describes it as an elevation raster.
  - path: Swan_Lake_DLB_M3_Digital_Surface_Model_04August2024_WGS84_UTM_Zone_3N_Ellipsoid_Height_10cm.tif
    product: dsm
    vertical_datum: WGS84 ellipsoid
    notes:
    - The EML entity for this file wrongly describes it as a 4-band multispectral image.
  - path: Swan_Lake_DLB_M3_Multispectral_Bands_04August2024_WGS84_UTM_Zone_3N_10cm.tif
    product: multispectral
    bands: [green, red, rededge, nir]
    unit: reflectance
    notes:
    - The EML entity for this file wrongly describes it as a 3-band RGB orthomosaic.
    - The multispectral footprint is smaller than the RGB and DSM footprints (GeoTIFF bboxes).
open_questions:
- 'RGB band order: every orthomosaic header declares red, green, blue, while every EML record says blue, green, red.
  The header order is used; check one file visually.'
- 'Positioning: all methods texts name both an RTK base (D-RTK 2) and Leica Viva ground control. Were the Leica points
  used as GCPs in processing, or only as check points? The Pix4D reports should say.'
- 'unit: reflectance is inferred from the radiometric calibration described in the methods; the value scale (0-1 or
  percent) is not stated. Check on a sample.'
- 'Site identity: ABON names the site Swan_Lake_DLB without MP64. The footprints overlap, but a person should confirm it
  is the same MP64 basin.'
- 'Vertical datum: the records say ellipsoid heights, with WGS84 horizontal datum; the ellipsoid realisation (e.g.
  WGS84 vs ITRF/NAD83 via the Leica survey) is not stated.'
- The DataONE member-node API endpoint is not given in the evidence or context, so source.api is left empty.
- Land status and Indigenous data governance of the Swan Lake basin are not stated in any record (see site hints).
