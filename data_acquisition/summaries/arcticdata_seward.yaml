      - {path: Swan_Lake_DLB_MP64_P4RTK_27March2022_Orthomosaic_WGS84_UTM_Zone3N_5cm.tif, product: orthomosaic}
      - {path: Swan_Lake_DLB_MP64_P4RTK_27March2022_Digital_Surface_Model_WGS84_UTM_Zone3N_Ellpsoid_Height_10cm.tif,
         product: dsm, vertical_datum: WGS 84 ellipsoidal height}
      - {path: Swan_Lake_DLB_MP64_27March2022_P4RTK_Pix4D_report.pdf, role: report, attach_to: [orthomosaic, dsm]}

  - folder: arcticdata/doi_10.18739_A2NS0M03W
    doi: doi:10.18739/A2NS0M03W
    record: {path: metadata.xml, format: eml}
    site: swan_lake_dlb
    date: 2022-08-12
    platform: DJI Phantom 4 RTK
