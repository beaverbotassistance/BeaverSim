  # ABON 2024: nine sites in one dataset; only the Swan Lake files were downloaded.
  - folder: arcticdata/doi_10.18739_A22R3NZ98
    doi: doi:10.18739/A22R3NZ98
    record: {path: metadata.xml, format: eml}
    download_filter: ^Swan_Lake_DLB_
    site: swan_lake_dlb
    date: 2024-08-04
    platform: DJI Mavic 3 Multispectral
    instruments: [M3M]
    positioning: [rtk, gcp]
    notes: ["EML attribute descriptions are shifted between files (the DSM is described as multispectral,
             the multispectral as RGB, the RGB as elevation); bands below follow the methods text"]
    files:
      - {path: Swan_Lake_DLB_M3_Orthomosaic_RGB_04August2024_WGS84_UTM_Zone_3N_5cm.tif, product: orthomosaic}
      - {path: Swan_Lake_DLB_M3_Digital_Surface_Model_04August2024_WGS84_UTM_Zone_3N_Ellipsoid_Height_10cm.tif,
         product: dsm, vertical_datum: WGS 84 ellipsoidal height}
      - {path: Swan_Lake_DLB_M3_Multispectral_Bands_04August2024_WGS84_UTM_Zone_3N_10cm.tif, product: multispectral,
         bands: [green, red, rededge, nir], unit: reflectance}
