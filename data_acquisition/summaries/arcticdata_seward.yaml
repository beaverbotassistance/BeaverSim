    files:
      - {path: Swan_Lake_DLB_MP64_P4RTK_12August2022_Orthomosaic_WGS84_UTM_Zone3N_5cm.tif, product: orthomosaic}
      - {path: Swan_Lake_DLB_MP64_P4RTK_12August2022_Digital_Surface_Model_WGS84_UTM_Zone3N_Ellipsoid_Heights_10cm.tif,
