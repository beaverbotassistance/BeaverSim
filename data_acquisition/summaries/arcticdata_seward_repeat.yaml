# Drafted by Claude in a Claude Code session (intake + describe prompts), reviewed by Federico Oliva.
schema: 1
dataset: arcticdata_seward_repeat
title: Repeat drone surveys of beaver dams and ponds at ten sites on the Seward and Baldwin Peninsulas, Alaska,
  2021-2024 (orthomosaics, DSMs, multispectral; Jones and Tape, NSF Arctic Data Center)
authored:
  by: claude
  model: claude-opus-5-5
  date: 2026-10-14
  note: Claude Code session, from evidence.json
reviewed:
  by: Federico Oliva
  date: 2026-10-14
source:
  kind: dataone
  provider: NSF Arctic Data Center
  url: https://arcticdata.io
  api: https://arcticdata.io/metacat/d1/mn/v2     # the coordinating node returned 404 for these data objects
  log: downloads.csv
