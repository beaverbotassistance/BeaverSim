- folder: arcticdata/doi_10.18739_A2599Z35K
  doi: doi:10.18739/A2599Z35K
  record:
    path: metadata.xml
    format: eml
  site: upper_nome_river
  date: 2021-08-04
  platform: DJI Phantom 4 RTK Multispectral
  positioning:
  - rtk
  evidence:
  - 'doi: folder name doi_10.18739_A2599Z35K'
  - 'site: file names (Upper_Nome_River_MP31) and EML title (Upper Nome River (MP31)); GeoTIFF footprint overlaps the upper_nome_river rasters of arcticdata_abon_2024 (100% of this raster''s box)'
  - 'date: file names (04August2021 / 04Aug2021), EML title, EML dates and methods text'
  - 'platform: methods text (DJI Phantom 4 Real-Time Kinematic (DJI P4RTK) Multispectral quadcopter); file names say P4_MultiSpectral'
  - 'positioning: methods text names a DJI D-RTK 2 Mobile Base Station -> rtk; the methods also say a Leica Viva differential GPS provided ground control, but the Pix4D report states ''Georeferencing: yes, no 3D GCP'', so gcp is not set (see open questions)'
  - 'product multispectral: file name (P4_MultiSpectral), EML title (Multispectral Orthomosaic Image), 5-band float32 GeoTIFF at 10 cm'
  - 'bands: EML entity attributes (Blue, Green, Red, Red Edge, Near Infrared); the GeoTIFF header does not declare them (gray + undefined)'
  - 'unit: methods text (MicaSense calibrated reflectance panel, radiometric calibration in the Pix4D Index Calculator)'
  - 'report: file name (P4_Multispectral_Pix4D_report), same date and sensor as the multispectral file'
  files:
  - path: Upper_Nome_River_MP31_P4_MultiSpectral_04Aug2021_WGS84_UTM_Zone_3N_10cm.tif
    product: multispectral
    bands: [blue, green, red, rededge, nir]
    unit: reflectance
  - path: Upper_Nome_River_MP31_04August2021_P4_Multispectral_Pix4D_report.pdf
    role: report
    attach_to: [multispectral]
