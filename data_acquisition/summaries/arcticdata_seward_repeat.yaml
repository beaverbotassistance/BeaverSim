open_questions:
- 'Positioning: every methods text names both a D-RTK 2 base (rtk) and Leica Viva ground control, but all 29 Pix4D reports state ''Georeferencing: yes, no 3D GCP''. Only rtk is set here. Was the Leica survey used to fix the base station, or as check points? The reviewed arcticdata_seward summary sets [rtk, gcp] for the same team and workflow; the two should be made consistent.'
- 'RGB band order: every orthomosaic header declares red, green, blue, while the EML records say blue, green, red. The header order is used; check one file visually.'
- 'unit: reflectance is inferred from the radiometric calibration described in the methods; the value scale (0-1 or percent) is not stated. Check on a sample.'
- 'Ptarmigan Creek: the EML bounds are the Willow Creek ones (see group notes); the rasters place it at -164.92 to
  -164.89 E, 65.24 to 65.25 N, outside every searched watershed of seward_baldwin_watersheds (willow_creek is 59%
  inside and was added to that region). Confirm the location.'
- 'Dates corrected from conflicting record fields: A2SF2MD49 (methods text 04 August 2021), A2Z31NQ6F (EML dates 2023-08-15), A2V97ZT1H (report name 27 March, methods 26 August 2022). Check against image EXIF if needed.'
- 'Swan Lake Creek RTK flights (60 ha) overlap the ABON 2024 swan_lake_creek rasters by only about a third of their box; the multispectral flights fall wholly inside. Same site, larger flight area, assumed.'
- 'Vertical datum: the records say ellipsoid heights with WGS84 horizontal datum; the ellipsoid realisation (e.g. WGS84 vs ITRF/NAD83 via the Leica survey) is not stated.'
- 'Land status and Indigenous data governance of all ten sites are not stated in any record (see site hints).'
