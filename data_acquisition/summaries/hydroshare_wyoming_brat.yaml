  - path: Extract_by_Mask_EVT.csv
    role: report
    attach_to: [model_output]
    notes:
    - 'Table of LANDFIRE EVT codes with the count of dams within 30 m and 100 m and the original BRAT vegetation code
      (columns EVT, 30m Count, 100m Count, OG Veg Code); the input of Dam_EVT_Exploration.Rmd for the Jenks natural
      breaks that recode vegetation suitability. Not described in the readme; the record abstract mentions "csv
      files for the input" of the Jenks script.'
  - path: Dam_EVT_Exploration.Rmd
    role: report
    attach_to: [model_output]
    notes:
    - 'R Markdown (document date 2025-09-24): Jenks natural breaks (4 classes) of dam counts per EVT class at 30 m and
      100 m, and the change from the original vegetation code; writes 30m_Jenks.csv and 100m_Jenks_EVT_Changes.csv
      (not in the record). Its last chunk uses a Chew table (CHEW.COUNT) that the script never loads, and the chew
      survey data are not in the record.'
  - path: WY_BRAT_Calibration_ValidationStats.Rmd
    role: report
    attach_to: [model_output]
    notes:
    - 'R Markdown by Michelle Andruss (document date 2025-10-16, last updated 2026-01-26): reads all 21 tables and, per
      scale (Tables 4, 5, 6), fits a multiple regression of oCC_EX on BRAT inputs, the aggregated R² of predicted
      versus observed capacity categories, confusion matrices (macro F1) and error plots (MAE, RMSE) of oCC_EX
      against DamKM. Capacity categories: None 0, Rare < 1, Occasional 1 to 5, Frequent 5 to 15, Pervasive >= 15 dams
      per km. Code partly from Macfarlane et al. 2024 (Montana Beaver Dam Census and BRAT Verification Report).'
  - path: readme.txt
    role: report
    attach_to: [model_output]
    notes:
    - 'Variable descriptions for each of the 21 tables (titles give the scale and calibration). Does not cover
      Extract_by_Mask_EVT.csv or Dam_EVT_Exploration.Rmd, describes MB_Riverscapes.csv with two variables only, and
      lists Shape_Le_1 for tables that lack it.'
  - path: resource.json
    role: metadata
    attach_to: [model_output]
    notes:
    - 'HydroShare record (CompositeResource, created 2026-01-26, modified 2026-01-27) by Michelle Andruss (University
      of Minnesota - Twin Cities); subjects Beaver Habitat Suitability, Beaver Restoration Assessment Tool. No spatial
      or temporal coverage, related publication or DOI (relations empty). Points to tools.riverscapes.net/brat/data
      and brat.riverscapes.net (BRAT v3 outputs) for the attribute definitions.'
open_questions:
- 'Dates: neither the record nor the readme gives the year of the BRAT inputs (LANDFIRE EVT version, hydrology) or of
  the observed dams. start_date 1990-01-01 is a placeholder with no evidence behind it; end_date is the record
  creation. The R script cites Tables 4 to 6 of an unlinked publication (likely a thesis by the author); find it for
  the dam mapping years and the BRAT input versions.'
- 'Observed dams: the dam attributes come from KMZ files named by HUC 8 (e.g. 10190015_final.kmz, 10180004.kmz) not
  included in the record. The Pole Mountain dams lie in the exact box of Wyoming_DamTraces.kmz (Fairfax 2025,
  hydroshare_eeager_dams); confirm whether they are the same dams (which would tie this site to that file and its CC
  BY-NC licence) and how the other dams were mapped (imagery, field survey).'
- 'Sites: HJ tables are set to wyoming_dam_traces because their dams match its bounds; the reach network
  (HJ_Riverscapes.csv spans four HUC 8) may extend beyond it. Decide whether to rename that site to Pole Mountain /
  Happy Jack or add a separate site. The new regions wyoming_brat_huc8 and medicine_bow_brat have no footprint here
  (non-spatial tables), so their extent and contains lists rest on the dam X/Y and HUC 8 codes; check them against
  the HUC 8 boundaries.'
- 'Site crs EPSG:32613 for the two new regions is chosen from the dam longitudes (-106.68 to -104.75 E, UTM zone 13);
  HUC 8 14050003 may extend west of -108 E (zone 12); confirm.'
- 'Join key: the reach geometries are not published. TARGET_FID is the only unique key but is the spatial join''s
  feature id; to place the rows on a map one needs the BRAT v3 networks (ReachID per network) and the Riverscapes
  BRAT networks (OBJECTID_1 / NHDPlusID per HUC 8) from tools.riverscapes.net; ask the author which network files were
  used.'
- 'X / Y CRS: not stated; the values are longitude and latitude, assumed WGS 84.'
- 'Chew survey: the survey data behind the Chew_Survey calibration (CHEW.COUNT in Dam_EVT_Exploration.Rmd) are not
  in the record.'
- Land status, governance and colonies of the three sites are not stated (see site hints).
