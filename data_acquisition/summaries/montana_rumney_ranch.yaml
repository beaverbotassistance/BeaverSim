# Drafted by Claude in a Claude Code session (describe prompt), from evidence.json, decisions.md and the Rumney
# Ranch layout file; reviewed by Federico Oliva.
schema: 1
dataset: montana_rumney_ranch
title: Weekly drone photos, orthomosaic tiles and chunks, and hand-mapped beaver structures (dams, canals, trails, lodges,
  ponds, colony boundaries) of Rumney Ranch, Montana, USA, June to August 2018 and September 2019 (field-season drive)
authored:
  by: claude
  model: claude-opus-5-5
  date: 2026-10-15
  note: Claude Code session, from evidence.json
reviewed:
  by: Federico Oliva
  date: 2026-10-15
source:
  kind: field
  provider: Field seasons 2018 and 2019, Seagate field-season drive (beaver_dataset/, hard links and layer exports of the
    original '2018 Field Season' and '2019 Field Season' folders)
sites:
  rumney_ranch:
    hints:
      colonies: 8 colonies, A to H (hdd_inventory.md, Rumney row; colony_boundaries.gpkg has 8 polygons named "Colony A",
        "Colony B", ...; canals and trails layers are per colony a-h). Whether all 8 were active in both 2018 and 2019 is
        not stated.
      land_status: Not stated in the evidence. "Ranch" in the site name suggests ranch land, private or leased; a person
        should check (see open questions).
      governance: Not stated. Unpublished field-season data on a private drive; no licence, data-use terms or landowner
        agreement is in the evidence.
groups:
- folder: sites/rumney_ranch
  site: rumney_ranch
  notes:
  - 'Placement is solved in the files (decisions.md): the annotation GeoPackages carry the ARC zone CRS (WGS_1984_ARC_System_Zone_12)
    written on a sphere of radius 6378137 m, as ArcGIS evaluates it, and every tile and chunk with an ArcGIS adjustment
    has its own .tif.aux.xml that applies it. The footprints in the evidence are correct.'
  - The chunks (orthomosaic_part-<n>_chunk-<k>, georeferenced again in ArcGIS in January 2020; RumneyRanch.mxd refers to
    them) are the annotation basemap. The full tiles carry an earlier georeferencing (October 2019) or, for 21 tiles, the
    export's own EPSG:4326 georeferencing, and can differ from the annotations by up to about 3 m.
  - 'Positioning is consumer GNSS only (no RTK, no ground control found): surveys are internally consistent but can be offset
    from each other by metres and need co-registration (hdd_inventory.md, issue 6).'
  - 'Tile numbers are meaningful only within one survey: the same number covers different areas on different days (field_naming.md).'
  evidence:
  - 'folder and file names: field_naming.md (surveys/<date>/photos, orthomosaic_part-<n>[_chunk-<k>], annotations/<date
    or year>/<feature>[_points][_colony-<id>][_<variant>].gpkg) and the layout file data_acquisition/field_layouts/rumney_ranch.yaml
    (original of every file, in each file''s notes)'
  - 'site: dataset name, layout file (site: rumney_ranch), survey.json (site: rumney_ranch); footprints of tiles and annotations
    (about 48.92-48.95 N, 113.08-113.14 W) match the Rumney Ranch centre of hdd_inventory.md (48.93, -113.12)'
  - 'product photos: evidence photo folders (EXIF camera FC6310), one item per survey folder; date: EXIF first/last capture
    times, all on the folder day (also survey.json first_photo/last_photo)'
  - 'product orthomosaic: GeoTIFF headers (uint8; full tiles 4 bands red, green, blue, alpha; chunks 3 bands red, green,
    blue), hence bands; variant: tile and chunk in the file name; date: survey folder, the EXIF day of the photos (field_naming.md,
    Dates); 2019 tiles placed on 09-03 and 09-05 by photo positions (decisions.md, item 5)'
  - 'orthomosaic notes: georeference.csv (control points, RMS, steps not applied); alignment.csv, median shift_m per date
    and kind over rows with fit_found True (decisions.md, item 2); October 2019 and January 2020 passes: decisions.md'
  - 'platform UAV and instruments: EXIF camera model FC6310 (DJI) in every photo folder; hdd_inventory.md (raw drone photos)'
  - 'positioning gnss: hdd_inventory.md issue 6 (consumer GPS only, no RTK found); no ground-control file in the folder'
  - 'product annotations: features mapped by people from the imagery (field_naming.md; layer names in the layout file);
    date: the annotations/<date> folder, the survey day named in the original layer name (layout file); annotations/2018
    holds layers without a day in their name, dated by year only'
  - 'annotations inspect: decisions.md, item 3 (text for all, plus the 2018-07-06 and 2018-08-22 addition)'
  - 'variant: annotation file name (each file holds one layer named as the file, field_naming.md)'
  - 'vertical_datum NAVD88: vector CRS of every layer ("NAVD88 height (ftUS)"), heights in US survey feet'
  - 'fields id: Name or NAME column (spelling differs between files) with the structure id (R40, R42_a, ..., Colony A) in
    the dam, dam point, dam width/thickness and colony boundary layers; sample rows in the evidence. Lodges, ponds and lodge
    points have this column empty in the sample rows, so no id is declared'
  - 'roles: survey.json (per survey, dated), manifest.csv, excluded.csv, georeference.csv and alignment.csv (whole site,
    no date) are records written by the field step: role metadata (decisions.md, item 6)'
  files:
