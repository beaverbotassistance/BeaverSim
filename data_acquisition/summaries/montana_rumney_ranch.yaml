    product: photos
    date: 2018-06-05
    platform: UAV
    instruments:
    - DJI FC6310 camera
    positioning:
    - gnss
    notes:
    - 1996 photos in 2 camera folders (100MEDIA, 101MEDIA), EXIF 06:43..09:09 by the camera clock, all DJI FC6310 (evidence).
