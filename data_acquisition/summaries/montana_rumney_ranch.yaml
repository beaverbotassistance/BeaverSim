open_questions:
- 'D06Sept2019_Dams_Rumney (annotations/2019-09-06/dams.gpkg) is named 06Sept2019, but no Rumney photos were taken that
  day (2019 photos: 09-03, eastern part; 09-05, the rest). Kept as 2019-09-06 for now (decisions.md, item 5): was it drawn
  on the 09-05 orthomosaic (then 2019-09-05), or on both days'' tiles?'
- Colony boundaries, lodges, dam widths and thicknesses and the river reach have no day in their names and are dated 2018
  (year only). Which survey were they drawn on?
- River reach derivatives (river_reach_merged, river_reach_points_spaced, river_reach_points_vertices) were made in 2020
  from the 2018 river reach; they are dated 2018 as the river they describe. Keep them as annotations, or leave them out
  as processing products?
- 21 full tiles (all of 2018-06-05 and 2018-06-13, and some tiles of other days) carry only the export's EPSG:4326 georeferencing,
  with no ArcGIS adjustment. decisions.md asks every full tile of a date with chunks to say it was georeferenced in October
  2019; for these tiles that is not true, so their note says how they are georeferenced and that their fit to the annotations
  is not measured. Is that right, and should alignment.csv measure them?
- 'RUMNEY_SIX_21June2018.tif is left out (layout file): an engineering CRS with no link to the earth, no ArcGIS adjustment,
  and none of its chunks georeferenced. Is there a correctly georeferenced copy?'
- 'Positioning: no RTK or ground control found (hdd_inventory.md); filed as gnss. Were any GCPs or check points surveyed
  at Rumney? The evidence does not say what the ArcGIS control points (georeference.csv) were tied to.'
- 'Land status and governance: the site''s owner and any data-use agreement are not in the evidence. The footprint (about
  48.93 N, 113.12 W) lies east of Glacier National Park; whether the ranch is inside the Blackfeet Indian Reservation is
  general knowledge to verify, not stated in any file. If it is, tribal data sovereignty applies before any release.'
