[pytest]
testpaths = tests
# ROS (on this machine's Python path) ships pytest plugins that are incompatible with this pytest
addopts = -p no:launch_testing -p no:launch_ros -p no:launch_pytest -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_xmllint -p no:ament_copyright -p no:cacheprovider
filterwarnings =
    ignore::PendingDeprecationWarning:rasterio
